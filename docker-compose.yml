version: '3.8'

services:
  backend:
    build: ./backend
    image: unihub-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:testdb

  frontend:
    build: ./frontend
    image: unihub-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend