services:
  backend:
    build: ./backend
    image: unihub-backend
    ports:
      - "8080:8080"
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    image: unihub-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend